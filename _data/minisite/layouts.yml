# Bento grid, auto-packed (pack.js). Each card declares its size once;
# the packer places them per filter — no hand-placed col/row.
# w/h  = desktop span in cells (4 × 252px).
# m    = mobile column span (2 fluid cols); height reuses h.
# flex = may be stretched to fill leftover cells, so dim cards always
#        land on a fresh row below (default false → keeps its size).
# filters = sections the card belongs to; 'All' shows every card. In a
#        filtered view, off-filter cards render dimmed + inert, below.
mobile_breakpoint: 768

# Nav filters, in tab order. 'All' shows every card; the rest match a
# card's `filters` list below.
filters:
  - All
  - About
  - Work
  - Side Quests

# DOM order = visual order the packer walks.
order:
  - about
  - gmail
  - linkedin
  - bulb
  - birds
  - statmoney
  - statusers
  - statyears
  - ticketing
  - agenticds
  - reviews
  - optimiser
  - filmforest
  - filmkea
  - dsquote
  - uxquote

cards:
  about:      { w: 2, h: 1, m: 2, filters: [About] }
  gmail:      { w: 1, h: 1, m: 1, filters: [About] }
  linkedin:   { w: 1, h: 1, m: 1, filters: [About] }
  bulb:       { w: 1, h: 1, m: 1, flex: true, filters: [Side Quests] }
  birds:      { w: 1, h: 1, m: 1, flex: true, filters: [Side Quests] }
  agenticds:  { w: 1, h: 2, m: 2, filters: [Work] }
  ticketing:  { w: 2, h: 2, m: 2, filters: [Work] }
  reviews:    { w: 1, h: 2, m: 2, filters: [Work] }
  optimiser:  { w: 2, h: 2, m: 2, filters: [Work] }
  filmforest: { w: 1, h: 2, m: 1, filters: [Side Quests] }
  filmkea:    { w: 1, h: 2, m: 1, filters: [Side Quests] }
  statmoney:  { w: 1, h: 1, m: 2, filters: [Work] }
  statusers:  { w: 1, h: 1, m: 2, filters: [Work] }
  statyears:  { w: 2, h: 1, m: 2, flex: true, filters: [Work] }
  dsquote:    { w: 2, h: 1, m: 2, flex: true, filters: [About, Work] }
  uxquote:    { w: 4, h: 1, m: 2, flex: true, filters: [About] }
