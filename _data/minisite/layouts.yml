    optimiser:  { col: '1 / 3', row: '5 / 7' }
    statmoney:  { col: '3',     row: '6' }
    statusers:  { col: '4',     row: '6' }
    filmforest: { col: '1',     row: '7 / 9' }
    filmkea:    { col: '2',     row: '7 / 9' }
    statyears:  { col: '3 / 5', row: '7' }
    dsquote:    { col: '3 / 5', row: '8' }
    uxquote:    { col: '1 / 5', row: '9' }

  About:
    about:      { col: '1 / 3', row: '1' }
    gmail:      { col: '3',     row: '1' }
