---
layout: minisite
---
{%- assign p = site.data.minisite.profile -%}
<header>
  <h1 style="font-family:'Syne',sans-serif;font-size:2rem;margin:0 0 12px;">{{ page.title }}</h1>
  <p>{{ page.description }}</p>
  <p>A case study by <a href="/">{{ p.name }} ({{ p.nickname }})</a>, {{ p.role | downcase }} — <a href="mailto:{{ p.email }}">{{ p.email }}</a> · <a href="{{ p.linkedin }}">LinkedIn</a></p>
</header>
<article>
  {{ content }}
</article>
