# ── Design principles (in expanded about) ──────────────────
principles:
  - title: Measure twice, cut once.
    body: >-
      Research is cheaper than redesign. I don't start pixels until we can
      say who it's for and what breaks if we're wrong.
  - title: Stay in the field.
    body: >-
      Wildlife taught me this — you lose the eye the day you stop looking
      through the lens. I keep half my calendar for craft, whatever my
      title says.
  - title: Teams outlive projects.
    body: >-
      Products ship and sunset; a team's standards compound. Hire people
      who argue back, then back them.
  - title: Simple survives.
    body: >-
      Every element is a liability. The designs that last are the ones with
      the fewest moving parts that still do the job.

# ── Quote cards ────────────────────────────────────────────
quotes:
  ux:
    tooltip: My UX philosophy
    quote: "The interface **is** the manual — nobody reads the other one."
    body: |
      If a flow needs a tooltip to survive, the flow is the bug. People
      don't arrive wanting to learn your product; they arrive mid-task,
      distracted, and generous with nothing. The screen has one chance to
      say **what this is, what just happened, and what happens next**.

      So I design for the person who reads nothing and notices everything.
      Every label earns its place, every state has an exit, and anything
      that needs explaining gets redesigned before it gets documented.
  craft:
    tooltip: My leadership philosophy
    quote: "I run design teams like a wildlife hide — **preparation, patience**, and knowing when not to press the shutter."
    body: |
      Photographing wild birds and leading designers reward the same
      instincts. You do the homework before you show up. You stay quiet
      long enough to see what's actually happening, not what you expected.
      And you learn that **the restraint is the skill** — most bad products,
      like most bad photographs, come from firing too early.

      In practice that means fewer, better bets: deep research before
      commitment, critique that sharpens instead of sands down, and a team
      trusted to work the problem without me hovering over the viewfinder.

