# ── Design principles (in expanded about) ──────────────────
principles_title: How I work
principles:
  - title: Measure twice, cut once.
    body: >-
      Research is cheaper than redesign. I don't start pixels until we can say who it's for and what breaks if we're wrong.
  - title: Stay in the field.
    body: >-
      Wildlife taught me this — you lose the eye the day you stop looking through the lens. I keep half my calendar for craft, whatever my title says.
  - title: People-focused problem solving
    body: >-
      Every design decision starts and ends with the people using the product. Deep user research and empathy aren't nice-to-haves — they're the foundation of everything we build.
  - title: Point the machine, keep the judgment.
    body: >-
      An agent is fast, confident, and wrong in ways that don't announce themselves. I give it the repeatable work and hold on to the deciding — and I expect the same split from everyone on the team.
  - title: Simplicity is the ultimate sophistication
    body: >-
      The best interfaces are invisible. I push teams to strip away complexity until what remains is intuitive, efficient, and delightful. If a user has to think about the UI, we haven't done our job.

# ── Quote cards ────────────────────────────────────────────
quotes:
  ux:
    tooltip: My UX philosophy
    label: My UX philosophy
    quote: "The interface **is** the manual — nobody reads the other one."
    body: |
      If a flow needs a tooltip to survive, the flow is the bug. People don't arrive wanting to learn your product; they arrive mid-task, distracted, and generous with nothing. The screen has one chance to say **what this is, what just happened, and what happens next**.

      So I design for the person who reads nothing and notices everything. Every label earns its place, every state has an exit, and anything that needs explaining gets redesigned before it gets documented.
  craft:
    tooltip: My leadership philosophy
    label: My leadership philosophy
    quote: "A leader's core strenth lies in their ability to lead their team through failure."
    body: |
      It brings me joy to help people achieve their full creative potential.

      **My design leadership style is people first:** people are foundational to building great things. With people at the center, I operate using what I've coined as the 4Ps of Leadership: Success for People, Partners, Projects, and Processes.
      
      **And this style is backed by substance:** I've honed my leadership approach over many years of experience in multiple tech sectors, company sizes, and scenarios.

