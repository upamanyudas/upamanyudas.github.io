# Impact stat cards (aggregate only, no company names on the site).
# `{years}` / `{start}` resolve against profile.career_start at page load,
# so the experience count rolls over on its own each January.
# Derivations for vetting (public figures, conservative):
#   $2B+  — live-entertainment GMV ≈ $400M/yr (BMS FY25 GMV ₹3,200cr ≈ $380M,
#           75% market share, ~250M tickets/yr) × 5-yr tenure ≈ $2B; travel
#           marketplace ≈ $1B+/yr bookings (Cleartrip GMV pre-acquisition);
#           tax pooling — TMNZ pool peaks ~NZ$10B, >$520M saved for clients.
#   517M+ — CV: "products used by over 517 million users" (cumulative across
#           consumer, enterprise & B2B).
#   52%   — CV: retention growth directly influenced by design work.
#   14+   — derived: current year minus profile.career_start (2012).
cards:
  - key: statmoney
    value: "$2B+"
    label: moved through experiences my teams shipped
    tooltip: "Where the money moved 💸"
    breakdown_title: Where that number comes from
    breakdown:
      - segment: Live-entertainment ticketing
        detail: "~$400M a year in tickets through a checkout we rebuilt — conversion up 38%"
      - segment: Online travel
        detail: "$1B+ in annual flight & hotel bookings on a core funnel we redesigned — conversion up 25%"
      - segment: Business tax
        detail: "a NZ$10B tax pool whose products my team re-imagined end to end"
    footnote: >-
      Conservative, public-market figures. The total isn't the point —
      the point is that design moved it.

  - key: statusers
    value: 170M+
    label: people used products my teams designed
    tooltip: "Who those people are 👥"
    breakdown_title: Who those people are
    breakdown:
      - segment: A consumer entertainment platform
        detail: "110M+ users — one of the world's largest ticketing audiences"
      - segment: A travel marketplace
        detail: "60M+ travellers across web and app, three markets"
      - segment: Fintech & enterprise tools
        detail: "0.5M+ business users who'd never met a designed tax product before"
    footnote: >-
      Cumulative reach across consumer, enterprise and B2B — plus 52%
      retention growth where my teams owned the experience.

  - key: statyears
    value: "{years}+"
    label: years designing, shipping and leading design teams
    tooltip: "What the years add up to ⏳"
    breakdown_title: What the years add up to
    breakdown:
      - segment: Five design & research functions
        detail: "built from zero — the hires, the craft bar, the rituals, all of it"
      - segment: A ten-person org across four time zones
        detail: "led today, with half the calendar still held back for craft"
      - segment: 21 record-setting deals, 15 contracts won back
        detail: "design was in the room where each of those was argued and won"
    footnote: >-
      The titles kept changing; taking a problem
      end-to-end never did.
