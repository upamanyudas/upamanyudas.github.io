# ── Expanded about bio (markdown; **bold** renders as brand gradient) ──
bio: |
  My name is Upamanyu Das, though everyone outside Bengal settles on **Upa**.
  I'm a designer who is happiest with one foot in **strategy** and the other in
  the **pixels** — currently Heading Design at
  [🐙 Octopus](https://octopus.com){: .bio-link .brand-octopus},
  leading a ten-person design org spread across four time zones.

  I trained at [Sir JJ School of Art](https://sirjjsaad.edu.in){: .bio-link .brand-jj}
  and the [National Institute of Design](https://www.nid.edu){: .bio-link .brand-nid},
  which between them beat two habits into me: draw it before you defend it,
  and question the brief before you answer it.

  Over the last {years}+ years I've built **five design & research functions from
  the ground up** — at [BookMyShow](https://in.bookmyshow.com/explore/home/mumbai){: .bio-link .brand-bms},
  where we rebuilt one of the most complex booking flows in live entertainment;
  at [Cleartrip](https://www.cleartrip.com){: .bio-link .brand-cleartrip},
  redesigning how millions book flights and hotels; and at
  [TMNZ](https://www.tmnz.co.nz){: .bio-link .brand-tmnz}, re-imagining how
  New Zealand businesses pay tax. Along the way I was instrumental in closing 21
  record-setting deals, winning back at-least 15 lost contracts, and growing retention by 52%.

  Most of my attention now goes to making design teams **AI-native** — the
  workflow, not the tool list. In practice that has meant rebuilding a design
  system so an agent could work inside it: tokens layered for a machine to
  follow, components that describe their own states, drift caught on a schedule
  instead of in review. I set the rules, the agent keeps the floor swept, and
  the designers spend their week on the calls no model is going to make for them.

  I'm blunt about where that line sits. A team that can only prompt isn't
  designing, it's placing orders — so I hire and coach for the opposite: taste
  you can defend out loud, and enough fluency with the tooling to know exactly
  where to stop trusting it. Which makes this a **leadership** problem long
  before it's a tooling one — what a machine is allowed to decide, what we
  never hand over, and who answers for the output.

  Titles never moved me off the tools. I still take a design problem
  end-to-end most weeks — research, flows, wireframes, the last pixel —
  because a leader who stops making things slowly stops **seeing** them.
  The kit: Figma, ProtoPie, HTML/CSS, Claude with an MCP server or two,
  product analytics, and an unreasonable number of whiteboards.

  Away from the screen I'm a wildlife photographer — twice named **Natural
  History Photographer of the Year** — and I've made two short films about
  New Zealand's wild places:
  [A Forest's Dream](/films/aforestsdream/){: .bio-link .brand-forest} and
  [The Birds of Play](/films/thebirdsofplay/){: .bio-link .brand-kea}.
  Waiting out a bird in the rain turns out to be excellent training for
  design leadership.

