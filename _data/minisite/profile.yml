# ── Expanded about bio (markdown; **bold** renders as brand gradient) ──
bio: |
  I'm Upa a design leader who is happiest with one foot in **strategy** and the other in the **pixels**. currently Heading Design at **🐙 Octopus**, leading a ten-person design org spread across four time zones.

  I have been designing digital products for the past {years}+ years. The title and the work kept changing shape — but its core motivation stays the same: building others up and leaving both people & organizations better than I found them. My skill set is a blend of hands-on craftsmanship and building highly functional teams. Together, we create delightful products and drive business growth. I’ve started and grown 5 Product Design & User Research functions from the ground up, helped scale 3 mid-size companies, and managed Product Design teams of 25+ (ICs and leaders). I’ve delivered products across Consumer, Enterprise, and B2B environments, used by over 517 million users. My work has had direct influence on closing 21 record-setting deals, won back 15 lost contracts, and been responsible for 52% retention growth.

  I trained at [Sir JJ School of Art](https://sirjjsaad.edu.in){: .bio-link .brand-jj} and the [National Institute of Design](https://www.nid.edu){: .bio-link .brand-nid}, which between them beat two habits into me: draw it before you defend it, and question the brief before you answer it.

  Over the last {years}+ years I've built **five design & research functions from the ground up** — at [BookMyShow](https://in.bookmyshow.com/explore/home/mumbai){: .bio-link .brand-bms}, where we rebuilt one of the most complex booking flows in live entertainment; at [Cleartrip](https://www.cleartrip.com){: .bio-link .brand-cleartrip}, redesigning how millions book flights and hotels; and at [TMNZ](https://www.tmnz.co.nz){: .bio-link .brand-tmnz}, re-imagining how New Zealand businesses pay tax. Along the way I was instrumental in closing 21 record-setting deals, winning back at-least 15 lost contracts, and growing retention by 52%.

  I bring **proven leadership**, design expertise, and a proactive mentality to the table. I excel at facilitating cross-functional involvement and recognize that great products aren't designed in isolation. My approach emphasizes building bridges between design, product, and engineering to create alignment that drives results. Most of my attention now goes to making design teams **AI-native** — the workflow, not the tool list.

  I may not be a founder, but I am an **entrepreneur**. I invest in company success proactively, understand business fundamentals, and contribute to organizational vision. I treat every team I join as if it were my own company — measuring success in outcomes, not outputs.

  I've spent the last decade maturing how design gets done — capacity planning, workflow systems, critique culture, and AI-augmented pipelines that compound team throughput. DesignOps is where strategy becomes leverage; I treat it as a primary leadership discipline, not back-office plumbing.

  I write extensively, mentor younger designers, and volunteer in design communities. Giving back isn't optional — it's how the discipline grows. I've built and grown 5 Product Design & User Research functions from scratch throughout my career.

  Titles never moved me off the tools and my core passion. I still take a design problem end-to-end most weeks — research, flows and wireframes — because a leader who stops making things slowly stops **seeing** them. The kit: Figma, ProtoPie, HTML/CSS, Claude with an MCP server or two, product analytics, and an unreasonable number of whiteboards.

  Away from the screen I'm a wildlife photographer — twice named **Natural History Photographer of the Year** — and I've made two short films about New Zealand's wild places: [A Forest's Dream](https://upamanyu.in/films/aforestsdream/){: .bio-link .brand-forest} and [The Birds of Play](https://upamanyu.in/films/thebirdsofplay/){: .bio-link .brand-kea}. Waiting out a bird in the rain turns out to be excellent training for design leadership.

